name: Windows packaged game
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download private beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.24.0-beta.1 --repo $env:GITHUB_REPOSITORY --pattern 'EarthUnscripted-0.24.0-beta.1-Windows-x64.zip'
          Expand-Archive 'EarthUnscripted-0.24.0-beta.1-Windows-x64.zip' -DestinationPath 'Game with spaces'
      - name: Run packaged Windows components
        shell: pwsh
        run: python Tools/check_windows_release.py 'Game with spaces/Earth Unscripted'
